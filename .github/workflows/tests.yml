# Runs the test suite automatically on every push to main.
#
# PLAIN ENGLISH: right now the tests only run when Itachi runs them by hand.
# This makes GitHub run every suite in package.json's test line itself, every time you upload a file.
# If something breaks, you get a red X on the commit and an email — before
# anyone opens the site. Nothing here touches the live site; it only checks.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test tools
        run: npm install --no-audit --no-fund

      - name: Install the browser the tests drive
        run: npx playwright install --with-deps chromium

      - name: Run all suites
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      # GitHub shows a run's log only to signed-in visitors; its annotations are public. On a red run this copies the
      # failed checks and the last lines into annotations, so the house can read WHY without signing in. (Oct 3 2026:
      # U1's first run failed and nobody here could see which check.)
      - name: Say what failed, where anyone can read it
        if: failure()
        shell: bash
        run: |
          esc() { printf '%s' "${1:0:900}" | tr -d '\r' | sed 's/%/%25/g'; }
          grep -E '❌|FAIL|Error' test.log | head -8 | while IFS= read -r l; do echo "::error title=failed check::$(esc "$l")"; done
          echo "::error title=last lines of the run::$(tail -6 test.log | while IFS= read -r l; do printf '%s%%0A' "$(esc "$l")"; done)"
